name: BetterBots Paper 26.3 smoke test
on:
  push:
    branches: [betterbots-paper-smoke]
    paths:
      - BetterBots/smoke/**
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download and verify server and test dependencies
        working-directory: BetterBots/smoke
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          mkdir -p server/plugins
          curl --fail --show-error --silent --location --retry 2 --max-time 90 -A 'BetterBots smoke test (https://github.com/Bobdahacker-official/FlintWS)' 'https://fill-data.papermc.io/v1/objects/64a5bd44910cb982b2648e9a35036cc95a6de4d561e15812aecf5411f84f7b01/paper-26.3-257.jar' -o server/paper.jar
          echo '64a5bd44910cb982b2648e9a35036cc95a6de4d561e15812aecf5411f84f7b01  server/paper.jar' | sha256sum --check
          for name in ViaVersion ViaBackwards; do
            curl --fail --show-error --silent --location --retry 2 --max-time 60 "https://github.com/ViaVersion/$name/releases/download/5.12.2/$name-5.12.2.jar" -o "server/plugins/$name.jar"
          done
          cp ../downloads/BetterBots-1.1.1.jar server/plugins/
      - name: Run gameplay and protocol smoke checks
        working-directory: BetterBots/smoke
        run: node smoke.cjs
