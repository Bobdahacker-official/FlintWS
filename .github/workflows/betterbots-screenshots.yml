name: BetterBots Minecraft screenshots
on:
  push:
    branches: [betterbots-screenshots]
    paths:
      - BetterBots/photos/**
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare virtual display and launcher
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth xdotool libgl1-mesa-dri libglx-mesa0
          python -m pip install --disable-pip-version-check minecraft-launcher-lib==8.0
      - name: Download the official Minecraft client and Paper server
        working-directory: BetterBots/photos
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          curl --fail --show-error --silent --location --retry 2 --max-time 90 -A 'BetterBots screenshot test (https://github.com/Bobdahacker-official/FlintWS)' 'https://fill-data.papermc.io/v1/objects/64a5bd44910cb982b2648e9a35036cc95a6de4d561e15812aecf5411f84f7b01/paper-26.3-257.jar' -o server/paper.jar
          echo '64a5bd44910cb982b2648e9a35036cc95a6de4d561e15812aecf5411f84f7b01  server/paper.jar' | sha256sum --check
          cp ../downloads/BetterBots-1.1.1.jar server/plugins/
          python prepare_client.py
      - name: Take 20 native screenshots on a loopback server
        working-directory: BetterBots/photos
        run: xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX +render -noreset' python capture.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BetterBots-20-Minecraft-screenshots
          path: BetterBots/photos/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
      - name: Upload troubleshooting logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BetterBots-screenshot-diagnostics
          path: |
            BetterBots/photos/*.log
            BetterBots/photos/diagnostic.png
            BetterBots/photos/client/crash-reports/
          if-no-files-found: ignore
          retention-days: 7
