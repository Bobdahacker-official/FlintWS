<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FlintWS web server status console">
    <title>FlintWS</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #101419; color: #edf2f7; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top right, #23384a, #101419 48%); }
      main { width: min(680px, calc(100% - 40px)); padding: 44px; border: 1px solid #334554; border-radius: 22px; background: rgba(18, 25, 32, .92); box-shadow: 0 24px 80px rgba(0, 0, 0, .35); }
      .eyebrow { margin: 0 0 10px; color: #65d8a3; font-size: .78rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -.06em; }
      p { color: #aebdca; line-height: 1.65; }
      dl { display: grid; grid-template-columns: 1fr auto; gap: 14px 20px; margin: 34px 0 0; padding-top: 24px; border-top: 1px solid #334554; }
      dt { color: #aebdca; } dd { margin: 0; color: #edf2f7; font-family: ui-monospace, monospace; }
      code { color: #65d8a3; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Online</p>
      <h1>FlintWS</h1>
      <p>A small, fast web server for serving this workspace with a monitored health endpoint and a clean static file pipeline.</p>
      <dl>
        <dt>Health check</dt><dd><code>/healthz</code></dd>
        <dt>Service info</dt><dd><code>/api/info</code></dd>
        <dt>Transport</dt><dd>HTTP/1.1</dd>
      </dl>
    </main>
  </body>
</html>
